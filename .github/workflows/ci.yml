name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e .[dev]
      - name: Validate normalized data
        run: python -m audit_rag.cli.main validate-data
      - name: Tests
        run: pytest -q
      - name: Lint project code
        run: ruff check src tests scripts
